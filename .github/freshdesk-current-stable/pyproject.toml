[project]
name = "mcphub-freshdesk"
version = "0.1.0"
description = "Freshdesk MCP connector with bounded HTTP helpers"
requires-python = ">=3.15"
dependencies = [
    "fastmcp==4.1.4",
    "requests==2.34.2",
    "python-dotenv==1.2.4",
    "colorama==0.4.6",
    "typing-extensions==4.16.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.3"]
build = ["pip==26.2.2", "setuptools==84.2.1", "wheel==0.48.0", "Cython==3.3.0"]

[tool.ruff]
target-version = "py315"
line-length = 120

# Public PyPI 6.0.3 metadata: Python >=3.8, no runtime dependencies.
# This avoids executing the source backend just to resolve metadata on CPython 3.15.
[[tool.uv.dependency-metadata]]
name = "pyyaml"
version = "6.0.3"
requires-python = ">=3.8"
requires-dist = []
