name: Trello callback state boundary
on:
  pull_request:
    paths:
      - trello/**
      - .github/scripts/trello_oauth_boundary_proof.py
      - .github/workflows/trello-oauth-boundary.yml
permissions:
  contents: read
jobs:
  state-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: trello
    env:
      UV_PYTHON_DOWNLOADS: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.6'
          enable-cache: false
      - name: Install the unchanged frozen graph under current stable Python
        run: uv sync --locked --all-groups --python 3.15.2
      - name: Compare original and patched real loopback requests and retain all source cases
        run: uv run --locked --all-groups --python 3.15.2 python -B ../.github/scripts/trello_oauth_boundary_proof.py
      - name: Retain complete source identities and unfiltered case results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trello-oauth-boundary-proof
          path: OAUTH_BOUNDARY_EVIDENCE
          if-no-files-found: error
          retention-days: 14
