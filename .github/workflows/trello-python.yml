name: Trello Python quality

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "trello/**"
      - ".github/workflows/trello-python.yml"
  pull_request:
    paths:
      - "trello/**"
      - ".github/workflows/trello-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trello-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trello
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: "trello/uv.lock"
      - run: uv sync --locked --all-groups --python 3.15.1
      - run: uv run --locked --all-groups --python 3.15.1 pytest -q
      - run: uv run --locked --all-groups --python 3.15.1 python -m compileall -q .

      - name: Audit the frozen full Python graph without advisory exclusions
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file requirements-audit.lock
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-audit.lock --no-deps --disable-pip --strict -f json -o python-audit.json
      - name: Build the Python 3.15 service container
        run: docker build --tag trello-mcp:ci .

      - name: Inspect actual image libraries without starting the connector
        shell: bash
        run: |
          docker image inspect trello-mcp:ci > image-inspect.json
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /app/.venv/bin/python trello-mcp:ci scripts/installed_runtime.py > installed-runtime.json
      - name: Run the existing source cases inside the unchanged runtime image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/tests .qualification/test-tools
          cp test_*.py .qualification/tests/
          uv export --locked --only-group dev --no-emit-project --format requirements-txt --output-file .qualification/test-tools.lock
          uv pip install --target .qualification/test-tools --require-hashes --only-binary=:all: --no-deps -r .qualification/test-tools.lock
          if find .qualification/test-tools -name '*.so' -print -quit | grep -q .; then
            echo 'Qualification tools must remain pure Python' >&2
            exit 1
          fi
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=0700 \
            --mount type=bind,src="$PWD/.qualification/tests",dst=/qualification-tests,readonly \
            --mount type=bind,src="$PWD/.qualification/test-tools",dst=/qualification-tools,readonly \
            -e PYTHONPATH=/qualification-tools:/app/trello -e HOME=/tmp \
            -e TRELLO_API_KEY=synthetic-ci-key -e TRELLO_TOKEN=synthetic-ci-token \
            -e TRELLO_MCP_DB_PATH=/tmp/trello-ci-mirror.db -e TRELLO_MCP_SETTINGS_FILE=/tmp/trello-ci-settings.json \
            --entrypoint /app/.venv/bin/python trello-mcp:ci -m pytest -q \
            -o cache_dir=/tmp/pytest-cache /qualification-tests 2>&1 | tee image-source-tests.log
      - name: Save exact image identity and scan the full raw package inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qualification/input .qualification/cache .qualification/reports
          docker image save trello-mcp:ci -o .qualification/input/image.tar
          python scripts/archive_image_identity.py .qualification/input/image.tar image-inspect.json trello-mcp:ci image-identity.json .qualification/input/config-id.txt
          docker run --rm --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=2g,uid="$(id -u)",gid="$(id -g)",mode=0700 \
            --mount type=bind,src="$PWD/.qualification/input",dst=/input,readonly \
            --mount type=bind,src="$PWD/.qualification/cache",dst=/cache \
            --mount type=bind,src="$PWD/.qualification/reports",dst=/reports \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /input/image.tar --cache-dir /cache --scanners vuln --list-all-pkgs \
            --ignorefile /dev/null --exit-code 1 --format json --output /reports/image-security.json
          python scripts/verify_image_security.py .qualification/reports/image-security.json image-identity.json installed-runtime.json > verified-image.json
      - name: Retain dependency and installed-runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trello-stable-runtime-evidence
          path: |
            trello/requirements-audit.lock
            trello/python-audit.json
            trello/image-inspect.json
            trello/installed-runtime.json
            trello/image-source-tests.log
            trello/image-identity.json
            trello/verified-image.json
            trello/.qualification/reports/image-security.json
          retention-days: 7
          if-no-files-found: warn
