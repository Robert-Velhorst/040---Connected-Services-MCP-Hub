name: Trello Python quality

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "trello/**"
      - ".github/workflows/trello-python.yml"
  pull_request:
    paths:
      - "trello/**"
      - ".github/workflows/trello-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trello-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trello
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15.0"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: "trello/uv.lock"
      - run: uv sync --locked --all-groups --python 3.15.0
      - run: uv run --locked --all-groups --python 3.15.0 pytest -q
      - run: uv run --locked --all-groups --python 3.15.0 python -m compileall -q .

      - name: Build the Python 3.15 service container
        run: docker build --tag trello-mcp:ci .
