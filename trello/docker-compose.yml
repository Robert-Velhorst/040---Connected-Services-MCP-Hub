services:
  trello-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${MCP_SERVER_PORT:-8000}:${MCP_SERVER_PORT:-8000}"
    volumes:
      - trello-mirror:/data
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      USE_CLAUDE_APP: "false"
      TRELLO_READ_ONLY: "${TRELLO_READ_ONLY:-true}"
      TRELLO_MCP_DB_PATH: /data/trello_cache.db
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  trello-mirror:
