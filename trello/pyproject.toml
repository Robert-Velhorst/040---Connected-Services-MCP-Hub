[project]
name = "trello-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    # Upper bound is required, not cautious: mcp 2.0 removed
    # `mcp.server.fastmcp`, which every tool module imports. An unpinned
    # install resolves to 2.x and the server fails at import with
    # ModuleNotFoundError. The committed uv.lock pins 1.25.0.
    "mcp[cli]>=1.17.0,<2",
    # Imported by server/settings.py; previously undeclared, so a clean
    # install produced ModuleNotFoundError at import time.
    "python-dotenv>=1.0.0",
    # Imported by main.py for Streamable HTTP mode; likewise undeclared.
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
