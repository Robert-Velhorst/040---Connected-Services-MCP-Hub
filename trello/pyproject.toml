[project]
name = "trello-mcp"
version = "0.1.0"
description = "Trello MCP connector with a read-only local mirror"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0,<3",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = ["pytest>=9"]
